# Hosted demo: disposable databases and demo accounts, never production data.
# The existing Traefik service supplies TLS on the isolated demo ingress network.
x-demo-api: &demo-api
  build: .
  restart: unless-stopped
  environment: &demo-environment
    DEMO_BIND_HOST: "0.0.0.0"
    DEMO_TRUSTED_HOSTS: "${DEMO_SUBDOMAIN:-demo}.${APP_DOMAIN:?Set APP_DOMAIN},127.0.0.1,localhost"
  networks:
    - demo_backend

services:
  api-squad:
    <<: *demo-api
    environment:
      <<: *demo-environment
      DEMO_PUBLIC_APP_URL: "https://${DEMO_SUBDOMAIN:-demo}.${APP_DOMAIN}/squad"
    command: ["uv", "run", "python", "-m", "app.demo", "--api-only", "--api-port", "8000", "--room", "squad"]

  api-matchday:
    <<: *demo-api
    environment:
      <<: *demo-environment
      DEMO_PUBLIC_APP_URL: "https://${DEMO_SUBDOMAIN:-demo}.${APP_DOMAIN}/matchday"
    command: ["uv", "run", "python", "-m", "app.demo", "--api-only", "--api-port", "8000", "--room", "matchday"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO: "1"
        VITE_DEMO_ROOMS: "1"
        NGINX_CONF: nginx.demo.conf
    restart: unless-stopped
    depends_on:
      - api-squad
      - api-matchday
    networks:
      - demo_ingress
      - demo_backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DEMO_INGRESS_NETWORK:-miootz_demo_web}"
      - "traefik.http.routers.miootz-hosted-demo.rule=Host(`${DEMO_SUBDOMAIN:-demo}.${APP_DOMAIN}`)"
      - "traefik.http.routers.miootz-hosted-demo.entrypoints=websecure"
      - "traefik.http.routers.miootz-hosted-demo.tls=true"
      - "traefik.http.routers.miootz-hosted-demo.tls.certresolver=letsencrypt"
      - "traefik.http.services.miootz-hosted-demo.loadbalancer.server.port=80"

networks:
  demo_ingress:
    external: true
    name: ${DEMO_INGRESS_NETWORK:-miootz_demo_web}
  demo_backend:
    internal: true
