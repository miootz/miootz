# ISOLATED DEMO STACK (docs/DEMO.md). Two rooms (squad + matchday), the same
# two-step landing page as the local overlay: a room picker at /api/demo, then
# a room-specific account chooser. Each room has a fresh temporary database and
# random local tokens; no Pocket ID.
#
#   docker compose --env-file .env.dev -f docker-compose.demo.yml up -d --build
#
# App:  https://app.miootz.local:8443   (room picker: /api/demo)
# Mutually exclusive with the dev stack: both own :8443 and the traefik name.

services:
  traefik:
    # v3: v2.10's docker client predates this engine's minimum API version.
    image: traefik:v3
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--entrypoints.websecure.address=:8443"
    ports:
      # Bind to loopback for local testing.
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./docker/traefik/certs:/certs:ro"
      - "./docker/traefik/tls.yml:/etc/traefik/tls.yml:ro"
    networks:
      - web

  api-squad:
    build: .
    container_name: miootz-demo-api-squad
    restart: unless-stopped
    environment:
      DEMO_BIND_HOST: "0.0.0.0"
      DEMO_TRUSTED_HOSTS: "${APP_DOMAIN},127.0.0.1,localhost"
      DEMO_PUBLIC_APP_URL: "https://${APP_DOMAIN}:8443/squad"
    command:
      - "uv"
      - "run"
      - "python"
      - "-m"
      - "app.demo"
      - "--api-only"
      - "--api-port"
      - "8000"
      - "--room"
      - "squad"
    networks:
      - web

  api-matchday:
    build: .
    container_name: miootz-demo-api-matchday
    restart: unless-stopped
    environment:
      DEMO_BIND_HOST: "0.0.0.0"
      DEMO_TRUSTED_HOSTS: "${APP_DOMAIN},127.0.0.1,localhost"
      DEMO_PUBLIC_APP_URL: "https://${APP_DOMAIN}:8443/matchday"
    command:
      - "uv"
      - "run"
      - "python"
      - "-m"
      - "app.demo"
      - "--api-only"
      - "--api-port"
      - "8000"
      - "--room"
      - "matchday"
    networks:
      - web

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO: "1"
        VITE_DEMO_ROOMS: "1"
        NGINX_CONF: nginx.demo.conf
    container_name: miootz_demo
    restart: unless-stopped
    depends_on:
      - api-squad
      - api-matchday
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.demo.entrypoints=websecure"
      - "traefik.http.routers.demo.tls=true"
      - "traefik.http.services.demo.loadbalancer.server.port=80"

networks:
  web:
    driver: bridge
