services:
  openldap:
    build:
      context: ./docker/openldap
    image: footy-legends-openldap:dev
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "Footy Legends"
      LDAP_DOMAIN: "footylegends.local"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-changeme}
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ldapsearch -x -H ldap://127.0.0.1 -D cn=admin,dc=footylegends,dc=local -w "$$LDAP_ADMIN_PASSWORD" -b dc=footylegends,dc=local -s base',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # No ACME here: *.footylegends.local is not public-DNS friendly; TLS uses Traefik's default cert.
      - "--entrypoints.websecure.address=:8443"
      # Plain HTTP for local dev (avoids "404" when hitting :8443 with http:// — websecure is HTTPS-only).
      - "--entrypoints.web.address=:8880"
    ports:
      - "8443:8443"
      - "8880:8880"
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web

  authelia:
    image: authelia/authelia
    container_name: authelia
    environment:
      # Portal is on :8443 in this compose file; session cookie URL must match the browser origin.
      AUTHELIA_SESSION_COOKIES_0_AUTHELIA_URL: "https://auth.footylegends.local:8443"
      # Match OpenLDAP admin password (docker/openldap bootstrap uses LDAP_ADMIN_PASSWORD).
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${LDAP_ADMIN_PASSWORD:-changeme}
    volumes:
      - ./docker/authelia/config.yml:/config/configuration.yml
    networks:
      - web
    depends_on:
      openldap:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.footylegends.local`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

  api:
    build: .
    container_name: footy_api
    env_file: .env
    environment:
      AUTH_REQUIRE_FORWARDED_HEADERS: "true"
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_USE_TLS: "false"
      AUTH_PORTAL_URL: "https://auth.footylegends.local:8443"
      LDAP_URI: ldap://openldap:389
      LDAP_BASE_DN: dc=footylegends,dc=local
      LDAP_BIND_DN: cn=admin,dc=footylegends,dc=local
      LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD:-changeme}
      LDAP_USERS_OU: ou=people
      LDAP_GROUPS_OU: ou=groups
      AUTHELIA_INVITE_DEFAULT_GROUPS: members
    volumes:
      - ./app:/app/app
      - ./data:/data
    networks:
      - web
    depends_on:
      openldap:
        condition: service_healthy
      authelia:
        condition: service_started
      mailhog:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.rule=Host(`api.footylegends.local`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # Tell Authelia the public portal URL (must include :8443 in this compose file).
      - "traefik.http.middlewares.footy-auth.forwardauth.address=http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.footylegends.local%3A8443"
      - "traefik.http.middlewares.footy-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.footy-auth.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      - "traefik.http.routers.api.middlewares=footy-auth@docker"
      # Same API via app host (browser same-origin /api/... → Authelia → strip /api → FastAPI)
      - "traefik.http.routers.api-on-app.rule=Host(`app.footylegends.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api-on-app.entrypoints=websecure"
      - "traefik.http.routers.api-on-app.tls=true"
      - "traefik.http.routers.api-on-app.middlewares=footy-auth@docker,api-strip@docker"
      - "traefik.http.routers.api-on-app.service=api"
      - "traefik.http.routers.api-on-app.priority=100"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: footy_frontend
    environment:
      # API is reached via Traefik (same origin /api); do not proxy from Vite to the API container.
      VITE_DOCKER_DEV: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    networks:
      - web
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.footylegends.local`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    networks:
      - web
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mail.footylegends.local`)"
      - "traefik.http.routers.mailhog.entrypoints=websecure"
      - "traefik.http.routers.mailhog.tls=true"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  # Web UI for OpenLDAP (users / groups). Log in with LDAP bind, e.g. cn=admin + LDAP_ADMIN_PASSWORD.
  ldap-account-manager:
    image: ghcr.io/ldapaccountmanager/lam:stable
    container_name: ldap_account_manager
    environment:
      LAM_LANG: en_US
      LAM_SKIP_PRECONFIGURE: "false"
      # Used for LAM config + LDAP profile password (same as OpenLDAP cn=admin in start.sh).
      LAM_PASSWORD: ${LDAP_ADMIN_PASSWORD:-changeme}
      LDAP_SERVER: ldap://openldap:389
      LDAP_DOMAIN: footylegends.local
      LDAP_BASE_DN: dc=footylegends,dc=local
      LDAP_USERS_DN: ou=people,dc=footylegends,dc=local
      LDAP_GROUPS_DN: ou=groups,dc=footylegends,dc=local
      LDAP_USER: cn=admin,dc=footylegends,dc=local
      LAM_DISABLE_TLS_CHECK: "true"
    volumes:
      - lam_config:/var/lib/ldap-account-manager/config
    networks:
      - web
    depends_on:
      openldap:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # HTTPS (note: http:// on :8443 does not work — use https:// or the HTTP route below on :8880).
      - "traefik.http.routers.lam.rule=Host(`lam.footylegends.local`)"
      - "traefik.http.routers.lam.entrypoints=websecure"
      - "traefik.http.routers.lam.tls=true"
      - "traefik.http.routers.lam.service=lam"
      - "traefik.http.routers.lam-http.rule=Host(`lam.footylegends.local`)"
      - "traefik.http.routers.lam-http.entrypoints=web"
      - "traefik.http.routers.lam-http.service=lam"
      - "traefik.http.services.lam.loadbalancer.server.port=80"

volumes:
  frontend_node_modules:
  openldap_data:
  openldap_config:
  lam_config:

networks:
  web:
    driver: bridge
