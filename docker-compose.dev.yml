# LOCAL DEV STACK. Hosts are parameterized: Compose interpolates the
# ${AUTH_DOMAIN}/${API_DOMAIN}/${APP_DOMAIN} vars from `.env.dev` ONLY when
# you pass `--env-file .env.dev` (which `./scripts/bootstrap.sh --dev` does).
#
#   cp .env.dev.example .env.dev && ./scripts/bootstrap.sh --dev
#   docker compose --env-file .env.dev -f docker-compose.dev.yml up -d
services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # No ACME: *.miootz.local is not public-DNS reachable; use mkcert.
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--entrypoints.websecure.address=:8443"
      # Plain HTTP for local dev, so hitting :8880 with http:// does not 404
      # (websecure is HTTPS-only).
      - "--entrypoints.web.address=:8880"
    ports:
      - "8443:8443"
      #- "8880:8880"
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./docker/traefik/certs:/certs:ro"
      - "./docker/traefik/tls.yml:/etc/traefik/tls.yml:ro"
    networks:
      - web

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket_id
    env_file: .env.dev
    environment:
      APP_URL: "https://${AUTH_DOMAIN}:8443"
      TRUST_PROXY: "true"
      STATIC_API_KEY: "${POCKET_ID_STATIC_API_KEY:-}"
    volumes:
      - ./data/pocket_id:/app/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.rule=Host(`${AUTH_DOMAIN}`)"
      - "traefik.http.routers.pocketid.entrypoints=websecure"
      - "traefik.http.routers.pocketid.tls=true"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"

  api:
    build: .
    container_name: miootz_api
    env_file: .env.dev
    environment:
      PUBLIC_APP_URL: "https://${APP_DOMAIN}:8443"
      POCKET_ID_INTERNAL_URL: "http://pocket-id:1411"
    volumes:
      - ./app:/app/app
      - ./data:/data
    networks:
      - web
    depends_on:
      pocket-id:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - >-
        traefik.http.routers.api-on-app.rule=Host(`${APP_DOMAIN}`) &&
        PathPrefix(`/api`)
      - "traefik.http.routers.api-on-app.entrypoints=websecure"
      - "traefik.http.routers.api-on-app.tls=true"
      - "traefik.http.routers.api-on-app.middlewares=api-strip@docker"
      - "traefik.http.routers.api-on-app.service=api"
      - "traefik.http.routers.api-on-app.priority=100"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: miootz_frontend
    environment:
      VITE_DOCKER_DEV: "1"
      VITE_POCKET_ID_ISSUER: "https://${AUTH_DOMAIN}:8443"
    env_file: .env.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    networks:
      - web
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

volumes:
  frontend_node_modules:

networks:
  web:
    driver: bridge
