version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./docker/traefik/acme.json:/acme.json"
    networks:
      - web

  authelia:
    image: authelia/authelia
    container_name: authelia
    volumes:
      - ./docker/authelia/config.yml:/config/configuration.yml
      - ./docker/authelia/users.yml:/config/users.yml
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.footylegends.local`)"
      - "traefik.http.routers.authelia.entrypoints=web"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

  api:
    build: .
    container_name: footy_api
    env_file: .env
    volumes:
      - ./app:/app
      - ./data:/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.footylegends.local`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # Authelia Forward Auth middleware would be added here

  gotify:
    image: gotify/server
    container_name: gotify
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`notify.footylegends.local`)"
      - "traefik.http.routers.gotify.entrypoints=web"
      - "traefik.http.services.gotify.loadbalancer.server.port=80"

networks:
  web:
    driver: bridge
