services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--tls.stores.default.defaultCertificate=/certs/cert.pem,/certs/key.pem"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./docker/traefik/acme.json:/acme.json"
      - "./docker/traefik/certs:/certs:ro"
    networks:
      - web
    labels:
      - "traefik.http.routers.traefik.tls.certfile=/certs/cert.pem"
      - "traefik.http.routers.traefik.tls.keyfile=/certs/key.pem"

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket_id
    environment:
      APP_URL: "https://auth.miootz.local"
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      STATIC_API_KEY: "${POCKET_ID_STATIC_API_KEY:-}"
    volumes:
      - ./data/pocket_id:/app/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.rule=Host(`auth.miootz.local`)"
      - "traefik.http.routers.pocketid.entrypoints=websecure"
      - "traefik.http.routers.pocketid.tls=true"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"

  api:
    build: .
    container_name: miootz_api
    env_file: .env
    environment:
      UPLOAD_DIR: /data/uploads
      POCKET_ID_INTERNAL_URL: "http://pocket-id:1411"
      POCKET_ID_APP_URL: "https://auth.miootz.local"
      POCKET_ID_STATIC_API_KEY: "${POCKET_ID_STATIC_API_KEY:-}"
      POCKET_ID_API_KEY: "${POCKET_ID_API_KEY:-}"
      POCKET_ID_OIDC_CLIENT_ID: "miootz-app"
      POCKET_ID_OIDC_ISSUER: "https://auth.miootz.local"
    volumes:
      - ./app:/app/app
      - ./data:/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.rule=Host(`api.miootz.local`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api-on-app.rule=Host(`app.miootz.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api-on-app.entrypoints=websecure"
      - "traefik.http.routers.api-on-app.tls=true"
      - "traefik.http.routers.api-on-app.middlewares=api-strip@docker"
      - "traefik.http.routers.api-on-app.service=api"
      - "traefik.http.routers.api-on-app.priority=100"
      - "traefik.http.routers.api-uploads-on-app.rule=Host(`app.miootz.local`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.api-uploads-on-app.entrypoints=websecure"
      - "traefik.http.routers.api-uploads-on-app.tls=true"
      - "traefik.http.routers.api-uploads-on-app.service=api"
      - "traefik.http.routers.api-uploads-on-app.priority=50"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_POCKET_ID_ISSUER: "https://auth.miootz.local"
        VITE_POCKET_ID_CLIENT_SECRET: "${POCKET_ID_OIDC_CLIENT_SECRET:-}"
    container_name: miootz_frontend
    networks:
      - web
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.miootz.local`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  web:
    driver: bridge
