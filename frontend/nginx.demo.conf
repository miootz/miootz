upstream squad_api {
    server api-squad:8000;
}

upstream matchday_api {
    server api-matchday:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /api/demo {
        proxy_pass http://squad_api/demo/rooms;
    }

    location = /api/health {
        proxy_pass http://squad_api/health;
    }

    # Unscoped API requests must never fall through to a shared room.
    location /api/ {
        return 404;
    }

    # Keep meetup event streams open and unbuffered in each room.
    location ~ ^/squad/api/meetups/[0-9]+/(data|chat)/events$ {
        rewrite ^/squad/api(/.*)$ $1 break;
        proxy_pass http://squad_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        access_log off;
    }

    location ~ ^/matchday/api/meetups/[0-9]+/(data|chat)/events$ {
        rewrite ^/matchday/api(/.*)$ $1 break;
        proxy_pass http://matchday_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        access_log off;
    }

    location ~ ^/squad/api/ {
        rewrite ^/squad/api(/.*)$ $1 break;
        proxy_pass http://squad_api;
    }

    location ~ ^/matchday/api/ {
        rewrite ^/matchday/api(/.*)$ $1 break;
        proxy_pass http://matchday_api;
    }

    location = /squad {
        return 308 /squad/;
    }

    location = /matchday {
        return 308 /matchday/;
    }

    location = /squad/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache" always;
    }

    location = /matchday/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Vite fingerprints these URLs. New releases use new filenames.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /squad/ {
        try_files $uri /index.html;
    }

    location /matchday/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri @lobby;
    }

    location @lobby {
        return 302 /api/demo;
    }
}
