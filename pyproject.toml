[project]
name = "footy-legends"
version = "0.1.0"
description = "Footy Legends API"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "python-multipart",
    "pytest",
    "httpx",
    "pytest-asyncio",
    "greenlet>=3.3.2",
    "itsdangerous>=2.2.0",
    "apscheduler>=3.10.0",
    "aiosmtplib>=5.1.0",
    "ldap3>=2.9.1",
    "pywebpush>=2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
