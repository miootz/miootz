[project]
name = "miootz"
version = "0.1.0"
description = "Miootz API"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "python-multipart",
    "pytest",
    "httpx",
    "pytest-asyncio",
    "greenlet>=3.3.2",
    "itsdangerous>=2.2.0",
    "apscheduler>=3.10.0",
    "aiosmtplib>=5.1.0",
    "pywebpush>=2.3.0",
    "pillow>=10.0.0",
    "py-vapid>=1.9.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
